<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cosmos-kit — звёзды сцены</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../src/fonts/fonts.css">
<link rel="stylesheet" href="../src/css/tokens.css">
<link rel="stylesheet" href="../src/css/components.css">
<style>
  body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg, #e6efff); font: 13px/1.4 system-ui, sans-serif; }
  .stars-bar { position: fixed; left: 16px; bottom: 16px; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; border-radius: 12px; background: rgb(10 12 18 / .72); backdrop-filter: blur(10px); }
  .stars-bar a { color: inherit; text-decoration: none; padding: 4px 10px; border-radius: 8px; opacity: .6; }
  .stars-bar a[aria-current] { opacity: 1; background: rgb(255 255 255 / .12); }
  .stars-bar output { font-variant-numeric: tabular-nums; opacity: .7; min-width: 9ch; }
  body.clean .stars-bar { display: none; }
</style>
</head>
<body>
  <!-- Сверка звёзд сцены: ?stars=plate | procedural. Параметры для скриптов: still=1 — неподвижный кадр (как reduced),
       clean=1 — без панели, px/py — указатель −1..1 (параллакс), wiggle=1 — указатель ходит по кругу (кадр каждый rAF). -->
  <div class="cosmos-wrap" id="cosmos-wrap" aria-hidden="true"><canvas class="cosmos" id="cosmos"></canvas><div class="cosmos-fallback"></div></div>
  <nav class="stars-bar" aria-label="Звёзды сцены">
    <span>звёзды:</span>
    <a href="?stars=plate" data-v="plate">plate</a>
    <a href="?stars=procedural" data-v="procedural">procedural</a>
    <output id="fps" title="кадров сцены в секунду (rAF)"></output>
  </nav>
  <script type="module">
    import { createCosmos } from '../src/js/cosmos.js';
    const q = new URLSearchParams(location.search);
    const mode = q.get('stars') === 'procedural' ? 'procedural' : 'plate';
    if (q.get('clean')) document.body.classList.add('clean');
    document.querySelectorAll('.stars-bar a').forEach((a) => { if (a.dataset.v === mode) a.setAttribute('aria-current', 'true'); a.href = '?' + new URLSearchParams({ ...Object.fromEntries(q), stars: a.dataset.v }); });
    const still = !!q.get('still');
    const api = createCosmos(document.getElementById('cosmos'), { reduced: still, stars: mode });
    window.cosmosApi = api;
    if (!api.ok) document.getElementById('cosmos-wrap').classList.add('fallback');
    new ResizeObserver(() => api.resize()).observe(document.getElementById('cosmos-wrap'));
    if (q.has('px') || q.has('py')) api.setPointer(+q.get('px') || 0, +q.get('py') || 0);
    addEventListener('pointermove', (e) => { if (!q.get('wiggle')) api.setPointer((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * -2); }, { passive: true });
    // счётчик rAF: сколько кадров браузера в секунду; при wiggle=1 указатель медленно ходит по кругу — сцена рисует каждый кадр
    const out = document.getElementById('fps');
    let n = 0, t0 = performance.now();
    window.__frames = [];
    const tick = (now) => {
      n++;
      if (q.get('wiggle')) { const a = now / 4000 * Math.PI * 2; api.setPointer(Math.cos(a), Math.sin(a)); }
      if (now - t0 >= 1000) { const f = n * 1000 / (now - t0); window.__frames.push(f); out.value = f.toFixed(1) + ' fps'; n = 0; t0 = now; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  </script>
</body>
</html>
