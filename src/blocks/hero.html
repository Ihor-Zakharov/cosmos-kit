<!-- БЛОК hero · первый экран главной. Один на сайт, только на главной.
     Правила: один <h1 class="display"> с одним .lit-словом; одна .btn.primary + одна .btn; текст слева (единственное левое место).
     Варианты: дыра по центру — <section class="hero axis"> + data-comp="center" на .cosmos-wrap; короткий — class="hero short" + data-comp="far".
     Цифры под текстом (необязательно, 3–4 шт.) — .hero-stats. -->
<section class="hero" id="hero">
  <div class="hero-inner">
    <p class="kicker">ЗАМЕНИТЬ кикер · 2–4 слова</p>
    <h1 class="display">ЗАМЕНИТЬ главная мысль с одним <span class="lit">освещённым</span> словом.</h1>
    <p class="lead">ЗАМЕНИТЬ одно-два предложения: что это и для кого.</p>
    <div class="hero-actions">
      <a class="btn primary" href="#contact">ЗАМЕНИТЬ главное действие</a>
      <a class="btn" href="#features">ЗАМЕНИТЬ второе действие</a>
    </div>
    <div class="hero-stats">
      <div class="stat"><b>12</b><span>ЗАМЕНИТЬ подпись числа</span></div>
      <div class="stat"><b>3×</b><span>ЗАМЕНИТЬ подпись числа</span></div>
      <div class="stat"><b>24/7</b><span>ЗАМЕНИТЬ подпись числа</span></div>
    </div>
  </div>
</section>
