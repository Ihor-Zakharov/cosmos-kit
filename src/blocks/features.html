<!-- БЛОК features · «что это даёт»: 3 (или 6) карточек в сетке.
     Правила: голова секции по центру; заголовок — утверждение, не «Возможности»; карточки .card.static; без .btn.primary.
     Иконки — только из спрайта: python3 kit/tools/check.py --icons. -->
<section class="section" id="features">

    <p class="kicker">ЗАМЕНИТЬ раздел</p>

  <div class="grid-3">
    <div class="card static">
      <span class="card-glyph"><svg><use href="kit/icons/sprite.svg#i-layers"/></svg></span>

      <p class="card-text">ЗАМЕНИТЬ одно-два предложения.</p>
    </div>
    <div class="card static">
      <span class="card-glyph"><svg><use href="kit/icons/sprite.svg#i-pulse"/></svg></span>
      <p class="card-title">ЗАМЕНИТЬ второе</p>
      <p class="card-text">ЗАМЕНИТЬ одно-два предложения.</p>
    </div>
    <div class="card static">
      <span class="card-glyph"><svg><use href="kit/icons/sprite.svg#i-wave"/></svg></span>

      <p class="card-text">ЗАМЕНИТЬ одно-два предложения.</p>
