<!-- cosmos-kit — спрайт иконок: общие UI-глифы (стрелки, папки, диалоги, дерево, тосты…),
     обобщено из ~/projects/video-downloader/vydra/static/index.html (inline <svg><symbol> в начале <body>).
     Фирменные глифы платформ (YouTube/TikTok/Instagram) НЕ перенесены — это бренд-специфика «выдры»,
     см. DESIGN-TODO.md. Использование: <svg><use href="icons/sprite.svg#i-check"/></svg> (или заинлайнить
     этот файл в разметку и ссылаться на #i-check — так делала «выдра», это быстрее без лишнего HTTP-запроса). -->
